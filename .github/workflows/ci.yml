name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned: its default rule set has changed between minor
          # releases (e.g. 0.16 enabled I001/UP006/... that 0.15 did not),
          # which silently breaks `ruff check .` on unrelated commits/PRs
          # when installed unpinned. Bump deliberately and re-lint locally.
          python -m pip install "ruff==0.15.16"
          python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Compile Python modules
        run: python -m compileall -q analysis attackers demos detectors oracles scenarios splits metrics.py run_benchmark.py readiness_gate.py

      - name: Run tests
        run: pytest -q

      - name: Readiness gate passes the rules detector
        run: python readiness_gate.py --detector rules

      - name: Readiness gate blocks the classifier (known-fail, expects exit 2)
        run: |
          set +e
          python readiness_gate.py --detector classifier
          status=$?
          set -e
          test "$status" -eq 2

      - name: Committed conversation stress results reproduce
        run: |
          python analysis/conversation_stress.py --output /tmp/conversation_stress.json
          diff /tmp/conversation_stress.json analysis/results/conversation_stress.json

      - name: Committed label-agreement results reproduce
        run: |
          python analysis/label_agreement.py --output /tmp/label_agreement.json
          diff /tmp/label_agreement.json analysis/results/label_agreement.json

      - name: Run maintained reproduction workflow
        run: OUTPUT_DIR=/tmp/agentic-misuse-reproduced bash scripts/reproduce_key_results.sh
